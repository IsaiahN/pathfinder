<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Project Pathfinder — a human-validation benchmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a20"/>
      <stop offset="0.45" stop-color="#101c26"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="38%" r="62%">
      <stop offset="0" stop-color="#d8a24a" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#d8a24a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d8a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8702c"/>
      <stop offset="0.25" stop-color="#f0c878"/>
      <stop offset="0.55" stop-color="#d8a24a"/>
      <stop offset="0.85" stop-color="#f0c878"/>
      <stop offset="1" stop-color="#a8702c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1218" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0b1218" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Serendipity-style radial rays, kept faint -->
  <g stroke="#d8a24a" stroke-opacity="0.07" stroke-width="1">
    <line x1="190" y1="160" x2="0" y2="20"/><line x1="190" y1="160" x2="0" y2="100"/>
    <line x1="190" y1="160" x2="0" y2="200"/><line x1="190" y1="160" x2="0" y2="300"/>
    <line x1="190" y1="160" x2="120" y2="0"/><line x1="190" y1="160" x2="300" y2="0"/>
    <line x1="190" y1="160" x2="420" y2="40"/><line x1="190" y1="160" x2="420" y2="280"/>
    <line x1="190" y1="160" x2="280" y2="320"/><line x1="190" y1="160" x2="60" y2="320"/>
  </g>

  <!-- Watson-style skyline -->
  <g fill="#070d12" fill-opacity="0.75">
    <rect x="0" y="240" width="70" height="80"/><rect x="74" y="264" width="52" height="56"/>
    <rect x="130" y="222" width="40" height="98"/><rect x="174" y="252" width="64" height="68"/>
    <rect x="242" y="236" width="46" height="84"/><rect x="292" y="272" width="58" height="48"/>
    <rect x="1050" y="250" width="60" height="70"/><rect x="1114" y="226" width="44" height="94"/>
    <rect x="1162" y="258" width="66" height="62"/><rect x="1232" y="240" width="48" height="80"/>
  </g>

  <!-- Large compass rose on the left -->
  <g transform="translate(180 160)">
    <circle r="76" fill="none" stroke="#d8a24a" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle r="60" fill="none" stroke="#d8a24a" stroke-opacity="0.22" stroke-width="0.9"/>
    <circle r="92" fill="none" stroke="#d8a24a" stroke-opacity="0.10" stroke-width="0.8"/>
    <g stroke="#d8a24a" stroke-opacity="0.5" stroke-width="1">
      <line x1="0" y1="-92" x2="0" y2="-78"/><line x1="0" y1="78" x2="0" y2="92"/>
      <line x1="-92" y1="0" x2="-78" y2="0"/><line x1="78" y1="0" x2="92" y2="0"/>
    </g>
    <path d="M0 -70 L14 -14 L70 0 L14 14 L0 70 L-14 14 L-70 0 L-14 -14 Z" fill="url(#gold)" fill-opacity="0.92" stroke="#f3d28c" stroke-width="0.8"/>
    <path d="M0 -70 L14 -14 L0 0 Z" fill="#fff3d6" fill-opacity="0.8"/>
    <path d="M0 70 L-14 14 L0 0 Z" fill="#7d5220" fill-opacity="0.9"/>
    <circle r="9" fill="#0b1218" stroke="#f3d28c" stroke-width="1.6"/>
    <circle r="2.6" fill="#f3d28c"/>
    <text x="0" y="-100" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing="3" fill="#d8a24a" fill-opacity="0.85">N</text>
  </g>

  <!-- Central dark panel -->
  <rect x="338" y="52" width="612" height="216" rx="16" fill="url(#panel)" stroke="#d8a24a" stroke-opacity="0.18"/>

  <!-- Watson gold rules with diamond -->
  <line x1="372" y1="94" x2="916" y2="94" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M644 94 l7 -6 l7 6 l-7 6 Z" fill="#d8a24a"/>
  <line x1="372" y1="222" x2="916" y2="222" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M644 222 l7 -6 l7 6 l-7 6 Z" fill="#d8a24a"/>

  <text x="644" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="5" fill="#d8a24a">1,300 QUESTIONS · 13 FIELDS · ONE METHOD</text>
  <text x="644" y="158" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="52" letter-spacing="2" fill="url(#gold)">PROJECT PATHFINDER</text>
  <text x="644" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#e8d3a8">A HUMAN-VALIDATION BENCHMARK</text>
  <text x="644" y="252" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#c9b58c">“In search of what holds, one problem at a time.”</text>

  <!-- Right-side faint compass arcs -->
  <g fill="none" stroke="#d8a24a" stroke-opacity="0.12">
    <circle cx="1180" cy="160" r="58"/><circle cx="1180" cy="160" r="82"/><circle cx="1180" cy="160" r="106"/>
  </g>
  <g fill="#d8a24a" fill-opacity="0.28">
    <circle cx="1180" cy="54" r="2.5"/><circle cx="1180" cy="266" r="2.5"/>
    <circle cx="1074" cy="160" r="2.5"/><circle cx="1286" cy="160" r="2.5"/>
  </g>

  <rect width="1280" height="320" fill="url(#vignette)"/>

  <!-- Double border with corner studs -->
  <rect x="10" y="10" width="1260" height="300" rx="4" fill="none" stroke="#d8a24a" stroke-opacity="0.75" stroke-width="1.4"/>
  <rect x="16" y="16" width="1248" height="288" rx="2" fill="none" stroke="#d8a24a" stroke-opacity="0.32" stroke-width="0.8"/>
  <g fill="#f0c878">
    <circle cx="10" cy="10" r="3.5"/><circle cx="1270" cy="10" r="3.5"/>
    <circle cx="10" cy="310" r="3.5"/><circle cx="1270" cy="310" r="3.5"/>
  </g>
</svg>
