name: Keepalive

# Public repos disable scheduled workflows after 60 days of inactivity.
# A bimonthly no-op commit keeps the sync schedule alive.

on:
  schedule:
    - cron: "7 3 1 */2 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive marker
        run: |
          mkdir -p .github
          printf 'last-keepalive: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/KEEPALIVE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
