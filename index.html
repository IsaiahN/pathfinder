<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Pathfinder — a human-validation benchmark</title>
  <meta name="description" content="1,300 questions, one method, and an open record of every human verdict. Explore the corpus and help test the Tether/WATSON metatheory.">
  <base href="/pathfinder/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var p = params.get('p');
        if (p) history.replaceState(null, '', '/pathfinder/' + p.replace(/^\//, '') + location.hash);
      } catch (e) { /* local file use */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" title="Toggle sections">☰</button>
    <a class="brand" href="./"><img class="brand-icon" src="assets/favicon.svg" alt=""><span>Project Pathfinder</span></a>
    <span class="crumb-sep">/</span>
    <span class="crumb" id="crumb">Corpus</span>
    <span class="mode-pill" id="mode-pill">OPEN BENCHMARK</span>
    <span class="spacer"></span>
    <button class="top-submit" id="submit-btn">＋ Submit a question</button>
    <button class="icon-btn" id="search-btn" title="Search (Ctrl+K)">⌕</button>
    <button class="icon-btn" id="shortcuts-btn" title="Keyboard shortcuts">⌨</button>
    <button class="icon-btn" id="theme-btn" title="Appearance">◐</button>
    <a class="icon-btn" href="https://github.com/IsaiahN/pathfinder" target="_blank" rel="noopener" title="GitHub repository"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <a class="icon-btn" href="https://github.com/IsaiahN/pathfinder#readme" target="_blank" rel="noopener" title="Method and privacy"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zm0 14.5A6.5 6.5 0 118 1.5a6.5 6.5 0 010 13z"/><path d="M7.25 7h1.5v5h-1.5V7zm0-2.75h1.5v1.5h-1.5v-1.5z"/></svg></a>
  </header>

  <div class="workspace">
    <aside class="rail rail-left" id="left-rail"></aside>
    <main class="main-pane" id="app" aria-live="polite"><div class="loading">Loading corpus…</div></main>
    <aside class="rail rail-right" id="right-rail"></aside>
  </div>

  <footer class="statusbar">
    <span class="status-dot"></span>
    <span id="status-left">Corpus ready</span>
    <span class="status-sep">·</span>
    <span id="status-count">1,300 problems</span>
    <span class="spacer"></span>
    <span id="status-saved">Public benchmark · no email addresses stored</span>
    <span class="status-sep">·</span>
    <span id="generated-at"></span>
  </footer>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modal-box"></div>
  </div>

  <div class="figure-backdrop" id="figure-modal" hidden>
    <div class="figure-shell">
      <div class="figure-toolbar">
        <span class="figure-title" id="figure-title">Figure</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="fig-out" title="Zoom out">−</button>
        <span class="figure-zoom" id="fig-zoom">100%</span>
        <button class="icon-btn" id="fig-in" title="Zoom in">＋</button>
        <button class="icon-btn" id="fig-reset" title="Reset view">⟲</button>
        <a class="icon-btn" id="fig-github" href="#" target="_blank" rel="noopener" title="Open SVG on GitHub">↗</a>
        <button class="icon-btn" id="fig-close" title="Close">✕</button>
      </div>
      <div class="figure-stage" id="figure-stage"><img id="figure-img" alt="Figure"></div>
      <p class="figure-hint">Scroll or pinch to zoom · drag to pan · double click to reset</p>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
